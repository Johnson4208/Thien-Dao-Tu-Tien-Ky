<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101612">
  <meta name="description" content="Bắt đầu tiên đồ của bạn. Luyện công, luyện đan, vượt cảnh giới và trừ yêu ở sáu vùng đất.">
  <title>Thiên Đạo · Tu Tiên Ký</title>
  <link rel="icon" href="./assets/seal.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/tien-do.webp" as="image">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./game.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">Đến nội dung</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#dong-phu" aria-label="Thiên Đạo, về động phủ">
        <img src="./assets/seal.svg" alt="" width="41" height="41">
        <span class="brand-text"><strong>Thiên Đạo</strong><span>TU TIÊN KÝ</span></span>
      </a>
      <nav class="main-nav" aria-label="Điều hướng trò chơi">
        <a href="#dong-phu" data-nav="dong-phu"><svg class="icon" aria-hidden="true"><use href="./icons.svg#temple"></use></svg><span>Động phủ</span></a>
        <a href="#tu-luyen" data-nav="tu-luyen"><svg class="icon" aria-hidden="true"><use href="./icons.svg#lotus"></use></svg><span>Tu luyện</span></a>
        <a href="#ban-do" data-nav="ban-do"><svg class="icon" aria-hidden="true"><use href="./icons.svg#map"></use></svg><span>Bản đồ</span></a>
        <a href="#hanh-trang" data-nav="hanh-trang"><svg class="icon" aria-hidden="true"><use href="./icons.svg#bag"></use></svg><span>Hành trang</span></a>
      </nav>
      <div class="header-actions">
        <button class="button button-primary resume-button" type="button" data-action="open-battle" hidden>Vào trận</button>
        <div class="stone-balance" title="Linh thạch">
          <svg class="icon" aria-hidden="true"><use href="./icons.svg#gem"></use></svg>
          <strong id="stones">60</strong><span>Linh thạch</span>
        </div>
        <button class="avatar-button" type="button" data-action="open-profile" aria-label="Hồ sơ nhân vật">
          <svg class="icon" aria-hidden="true"><use href="./icons.svg#user"></use></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="content" class="shell main-shell" tabindex="-1">
    <p class="loading">Đang mở động phủ…</p>
    <noscript>Hãy bật JavaScript để chơi Thiên Đạo.</noscript>
  </main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <span class="footer-brand"><span aria-hidden="true">◇</span> Thiên Đạo <span class="footer-divider">/</span> Tu Tiên Ký</span>
      <div class="footer-actions">
        <button class="text-button" type="button" data-action="open-help">Hướng dẫn</button>
        <span id="save-status" class="save-status"><i></i> Đã lưu trên thiết bị</span>
      </div>
    </div>
  </footer>
  <dialog id="game-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toasts" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
