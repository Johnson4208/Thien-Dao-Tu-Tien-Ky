<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101612">
  <meta name="description" content="Tự do đi lại trong tiểu viện, hái thuốc, luyện đan tại lò, rèn pháp bảo ở đe, tĩnh tọa và khám phá thành phố.">
  <title>Thiên Đạo · Tu Tiên Ký</title>
  <link rel="icon" href="./assets/seal.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=2">
  <link rel="stylesheet" href="./exploration.css?v=5">
  <link rel="stylesheet" href="./immersive.css?v=5">
  <script type="module" src="./game.js?v=5"></script>
</head>
<body class="game-mode">
  <a class="skip-link" href="#content">Đến nội dung</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#dong-phu" aria-label="Thiên Đạo, về động phủ">
        <img src="./assets/seal.svg" alt="" width="41" height="41">
        <span class="brand-text"><strong>Thiên Đạo</strong><span>TU TIÊN KÝ</span></span>
      </a>
      <span class="game-edition">TIÊN ĐỒ CỦA BẠN <i></i> THẾ GIỚI TỰ DO</span>
      <div class="header-actions">
        <button class="button button-primary resume-button" type="button" data-action="open-battle" hidden>Vào trận</button>
        <div class="stone-balance" title="Linh thạch">
          <svg class="icon" aria-hidden="true"><use href="./icons.svg#gem"></use></svg>
          <strong id="stones">60</strong><span>Linh thạch</span>
        </div>
        <button class="avatar-button" type="button" data-action="open-profile" aria-label="Hồ sơ nhân vật">
          <svg class="icon" aria-hidden="true"><use href="./icons.svg#user"></use></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="content" class="shell main-shell" tabindex="-1">
    <p class="loading">Đang mở động phủ…</p>
    <noscript>Hãy bật JavaScript để chơi Thiên Đạo.</noscript>
  </main>
  <div class="sr-only"><span id="save-status"></span></div>
  <dialog id="game-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toasts" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
